apiVersion: apps/v1
kind: Deployment
metadata:
  name: departures-api
  labels: {app: departures-api}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: departures-api}
  template:
    metadata:
      labels: {app: departures-api}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: ERROR_RATE
              value: {{ .Values.errorRate | quote }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}